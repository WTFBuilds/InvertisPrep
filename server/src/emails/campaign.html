<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
    <style>
      body { margin: 0; padding: 0; background: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
      .wrapper { padding: 32px 16px; }
      .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb; }
      .banner { width: 100%; display: block; }
      .content { padding: 28px 32px; }
      h1 { font-size: 22px; color: #0f172a; margin: 0 0 8px; }
      .intro { color: #475569; font-size: 15px; margin: 0 0 12px; }
      .section-block { margin: 14px 0; }
      .section-block img { max-width: 100%; border-radius: 8px; display: block; }
      .section-block h3 { color: #0f172a; font-size: 16px; margin: 0 0 4px; }
      .section-block p { color: #475569; font-size: 14px; line-height: 1.6; margin: 0; }
      .btn { display: inline-block; padding: 12px 22px; background: #0f172a; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 14px; }
      .footer { margin-top: 22px; font-size: 12px; color: #94a3b8; border-top: 1px solid #eef2f7; padding-top: 14px; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        {{#bannerUrl}}<img class="banner" src="{{bannerUrl}}" alt="" />{{/bannerUrl}}
        <div class="content">
          <h1>{{heading}}</h1>
          <p class="intro">{{intro}}</p>
          {{#sections}}
          <div class="section-block">
            {{#imageUrl}}<img src="{{imageUrl}}" alt="" />{{/imageUrl}}
            {{#heading}}<h3>{{heading}}</h3>{{/heading}}
            {{#text}}<p>{{text}}</p>{{/text}}
            {{#url}}<a class="btn" href="{{url}}">{{text}}</a>{{/url}}
          </div>
          {{/sections}}
          <div class="footer">{{footer}}</div>
        </div>
      </div>
    </div>
  </body>
</html>
